apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipwave-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipwave-api
  template:
    metadata:
      labels:
        app: shipwave-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.containerPort }}
          env:
            - name: API_KEY
              value: "{{ .Values.api.env.apiKey }}"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi